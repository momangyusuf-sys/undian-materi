<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undian Materi Kelompok Otomatis</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; padding: 20px; text-align: center; color: #2c3e50; }
        .container { max-width: 500px; background: white; margin: 20px auto; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        select, button { width: 100%; padding: 12px; margin: 15px 0; border-radius: 4px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; }
        button { background: #27ae60; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #219653; }
        button:disabled { background: #bdc3c7; cursor: not-allowed; }
        .hasil { margin-top: 15px; padding: 15px; background: #e8f8f5; border: 1px solid #2cc7a0; border-radius: 4px; display: none; font-weight: bold; color: #117a65; }
        .tabel-container { max-width: 500px; margin: 30px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #2980b9; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .kosong { text-align: center; color: #7f8c8d; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎰 Undian Materi Kelompok</h2>
    <p>Silakan pilih kelompok Anda untuk mengundi materi secara acak.</p>
    
    <!-- Dropdown ini sekarang otomatis terisi data dari Google Sheets -->
    <select id="pilihKelompok">
        <option value="">-- Memuat Daftar Kelompok... --</option>
    </select>
    
    <button id="btnUndi" onclick="kirimUndian()" disabled>MEMUAT DATA...</button>
    <div id="boxHasil" class="hasil"></div>
</div>

<div class="tabel-container">
    <h3>📊 Papan Hasil Undian (Real-Time)</h3>
    <table>
        <thead>
            <tr>
                <th>Kelompok</th>
                <th>Materi Yang Didapat</th>
            </tr>
        </thead>
        <tbody id="bodyTabel">
            <tr>
                <td colspan="2" class="kosong">Memuat data papan undian...</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    // GANTI DENGAN URL WEB APP BARU ANDA DARI GOOGLE APPS SCRIPT
    const API_URL = "https://script.google.com/macros/s/AKfycbzAKaSIAZnkxiZzSuzuJGgeHu3i8pHbGR_nzgjEt0ZlTeZpY_123wbGYLXjm1A2ZXBTow/exec"; 

    window.onload = muatDataGoogleSheets;

    async function muatDataGoogleSheets() {
        try {
            const response = await fetch(API_URL);
            const data = await response.json();
            
            // 1. Isi Dropdown Kelompok secara Otomatis
            const selectKelompok = document.getElementById("pilihKelompok");
            selectKelompok.innerHTML = "";
            
            if(data.kelompok.length === 0) {
                selectKelompok.innerHTML = '<option value="">-- Semua Kelompok Sudah Mengundi --</option>';
                document.getElementById("btnUndi").disabled = true;
                document.getElementById("btnUndi").innerText = "UNDIAN SELESAI";
            } else {
                data.kelompok.forEach(k => {
                    let opt = document.createElement('option');
                    opt.value = k;
                    opt.innerHTML = k;
                    selectKelompok.appendChild(opt);
                });
                document.getElementById("btnUndi").disabled = false;
                document.getElementById("btnUndi").innerText = "KLIK UNTUK UNDI MATERI";
            }

            // 2. Isi Papan Tabel Real-Time
            const tbody = document.getElementById("bodyTabel");
            tbody.innerHTML = "";

            if (data.log.length === 0) {
                tbody.innerHTML = `<tr><td colspan="2" class="kosong">Belum ada kelompok yang mengundi.</td></tr>`;
                return;
            }

            data.log.forEach(item => {
                const row = `<tr><td><b>${item.kelompok}</b></td><td>✨ ${item.materi}</td></tr>`;
                tbody.insertAdjacentHTML('beforeend', row);
            });

        } catch (error) {
            console.error("Gagal sinkronisasi data:", error);
            document.getElementById("bodyTabel").innerHTML = `<tr><td colspan="2" class="kosong" style="color:red;">Gagal terhubung ke database server.</td></tr>`;
        }
    }

    async function kirimUndian() {
        const kelompok = document.getElementById("pilihKelompok").value;
        const btn = document.getElementById("btnUndi");
        const boxHasil = document.getElementById("boxHasil");
        
        if(!kelompok) return;
        if(!confirm(`Apakah Anda benar mewakili ${kelompok}? Pilihan tidak bisa diulang.`)) return;

        btn.disabled = true;
        btn.innerText = "Mengundi...";
        boxHasil.style.display = "none";

        try {
            const response = await fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({ kelompok: kelompok })
            });
            const data = await response.json();
            
            if(data.status === "success") {
                boxHasil.innerHTML = `Sukses!<br>${kelompok} mendapatkan:<br><span style="font-size:18px; color:#117a65;">🎯 ${data.materi}</span>`;
                boxHasil.style.display = "block";
                
                // Segera sinkronisasi ulang data terbaru
                await muatDataGoogleSheets();
            } else {
                alert("Gagal: " + data.message);
                await muatDataGoogleSheets();
            }
        } catch (error) {
            alert("Terjadi masalah jaringan ke Google Sheets.");
            console.error(error);
        }
    }
</script>
</body>
</html>
